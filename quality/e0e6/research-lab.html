<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my-search 実験ラボ</title>
  <style>
    body{font:16px/1.6 system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#202124}fieldset,article{margin:1rem 0;padding:1rem;border:1px solid #bbb;border-radius:8px}label{display:block;margin:.45rem 0}button,select{font:inherit;padding:.4rem}.phases{display:flex;flex-wrap:wrap;gap:.5rem}.flow{display:grid;grid-template-columns:minmax(170px,1fr) 3fr;gap:1rem}.flow-nav{display:grid;gap:.5rem;align-content:start}.flow-nav button[aria-current=step]{outline:3px solid #4169e1}.transfer{background:#f3f6fa;padding:.75rem;border-radius:8px}#status{min-height:2em}.notice{background:#f3f6fa;padding:1rem;border-radius:8px}[hidden]{display:none!important}
  </style>
</head>
<body>
  <h1>実験ラボ（合成課題）</h1>
  <p class="notice">この画面はローカルの合成課題だけを記録します。記事本文、検索語、URL、メモ、カードIDは入力・保存しません。参加に同意しない場合、記録は開始されません。作成した記録はこの端末から削除できます。</p>
  <fieldset>
    <legend>課題と独立条件</legend>
    <label>実験 <select id="experiment"><option>E6</option><option>E0</option></select></label>
    <label>合成課題 <select id="task"><option value="synthetic-integrate-01">synthetic-integrate-01（同一のE6比較課題）</option><option value="synthetic-refind-01">synthetic-refind-01（保存済みメモの再発見）</option><option value="synthetic-resume-01">synthetic-resume-01（読む・保存・再発見・再開）</option></select></label>
    <label>E6並行課題形式 <select id="task-form"><option value="synthetic-form-a">形式A</option><option value="synthetic-form-b">形式B</option><option value="synthetic-form-c">形式C</option></select></label>
    <label>A 自動化 <select id="automation"><option>manual</option><option>suggest</option><option>confirm</option><option>reversible_execute</option></select></label>
    <label>V 表示 <select id="visibility"><option>current</option><option>subtle_hint</option><option>nonmodal_expand</option></select></label>
    <label>T 提示時点 <select id="timing"><option>on_request</option><option>task_boundary</option><option>immediate</option></select></label>
    <label>E6 操作構成 <select id="workflow-condition"><option>mvp</option><option>separated</option><option>integrated</option></select></label>
    <label><input id="consent" type="checkbox"> 合成課題の匿名イベントをこの端末に記録することに同意します</label>
    <button id="start">同意して開始</button>
  </fieldset>
  <fieldset>
    <legend>合成タスク段階（入力内容は記録しません）</legend>
    <article aria-labelledby="source-title">
      <h2 id="source-title">共通資料</h2>
      <p id="source-body"></p>
      <p id="common-material-description">開始後、選択した課題形式に応じた資料を表示します。各形式内では全条件で資料・道具・保存対象・実行権限を固定します。</p>
    </article>
    <p id="condition-description" class="notice">開始後に選択した条件の操作フローを表示します。</p>
    <div class="flow" id="workflow" hidden>
      <nav class="flow-nav" id="workflow-nav" aria-label="合成課題の段階"></nav>
      <section id="phase-panel" aria-live="polite"></section>
    </div>
    <p id="transfer-status" class="transfer" hidden></p>
    <button id="complete">タスク完了を記録</button>
    <button id="abandon">途中離脱を記録</button>
  </fieldset>
  <button id="withdraw">記録をすべて削除</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="/research-lab.js" defer></script>
</body>
</html>
