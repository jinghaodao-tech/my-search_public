<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>my-search 内蔵ブラウザー</title>
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { margin: 0; padding: 8px 10px; }
    .toolbar { display: grid; grid-template-columns: auto auto auto minmax(200px,1fr) auto auto; gap: 6px; align-items: center; }
    button, input { min-height: 32px; border: 1px solid #8887; border-radius: 6px; padding: 4px 9px; background: Canvas; color: CanvasText; }
    button { cursor: pointer; } button:disabled { opacity: .5; cursor: default; }
    #url { width: 100%; box-sizing: border-box; }
    #tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 7px; min-height: 30px; }
    .tab { white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
    .tab[aria-current="page"] { border-color: #4b81ee; }
    #status { margin: 5px 0 0; color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <div class="toolbar" role="toolbar" aria-label="Webブラウザー操作">
    <button id="back" title="戻る" aria-label="戻る">←</button>
    <button id="forward" title="進む" aria-label="進む">→</button>
    <button id="reload" title="再読み込み" aria-label="再読み込み">⟳</button>
    <form id="navigate"><input id="url" type="url" autocomplete="url" placeholder="https://example.com" aria-label="HTTPSアドレス"></form>
    <button id="new-tab">新しいタブ</button>
    <button id="send-selection">選択文をmy-searchへ</button>
  </div>
  <div id="tabs" role="tablist" aria-label="開いているタブ"></div>
  <p id="status" role="status">Webページからのダウンロード、権限要求、新規ウィンドウは無効です。</p>
  <script src="browser-renderer.js"></script>
</body>
</html>
