openapi: 3.1.0
info:
  title: My Search App API
  version: 1.0.0
  description: Local-first card, candidate, collection, and search API.
servers:
  - url: http://127.0.0.1:3000
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200': { description: Healthy application and database }
  /api/cards:
    get:
      operationId: listCards
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: archived, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Card list }
    post:
      operationId: createCard
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CardInput' } }
      responses:
        '200': { description: Created card }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/saved-searches:
    get:
      operationId: listSavedSearches
      responses:
        '200': { description: Saved searches ordered by most recently updated }
    post:
      operationId: createSavedSearch
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SavedSearchInput' } }
      responses:
        '201': { description: Saved search with generated id }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/saved-searches/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateSavedSearch
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SavedSearchInput' } }
      responses:
        '200': { description: Updated search }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSavedSearch
      responses:
        '200': { description: Search removed; candidates and cards are unchanged }
  /api/candidates/{id}/defer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: deferCandidate
      responses:
        '200': { description: Candidate in deferred state; saved and expired candidates remain unchanged }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/run:
    post:
      operationId: runSearch
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SearchRequest' } }
      responses:
        '200': { description: Ranked results with plain-text snippet, candidate state and scope (corpus, totalCount, searchedCount, sources, availableSources) }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/collect:
    post:
      operationId: collect
      requestBody:
        content:
          application/json: { schema: { type: object, properties: { fixture: { type: string }, background: { type: boolean } } } }
      responses:
        '200': { description: Collection result }
        '202': { description: Background collection job accepted }
  /api/jobs:
    get:
      operationId: listJobs
      responses:
        '200': { description: Persisted background jobs }
  /api/jobs/{id}:
    get:
      operationId: getJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Job status }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cards/{id}:
    delete:
      operationId: deleteCard
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Card deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cards/summarize-bulk:
    post:
      operationId: summarizeCardsBulk
      responses:
        '202': { description: Summary job accepted; response includes jobId }
        '500': { description: AI provider unavailable }
  /api/zettelkasten/graph:
    get:
      operationId: getGraph
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Paginated graph nodes and edges }
  /api/tags:
    get:
      operationId: listTags
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Tags, optionally paginated }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    CardInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1 }
        body: { type: string }
        tags: { type: array, items: { type: string } }
        type: { type: string, enum: [article, memo, csv] }
    SearchFilters:
      type: object
      additionalProperties: false
      properties:
        excludedTerms: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 100 } }
        sources: { type: array, maxItems: 100, items: { type: string, maxLength: 200 } }
        status: { type: string, enum: [all, unreviewed, deferred, saved_as_card], default: all }
    SavedSearchInput:
      type: object
      additionalProperties: false
      required: [name, source, config, options, filters]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        source: { type: string, enum: [articles, cards] }
        config: { type: object, description: Same validated ranking config as SearchRequest }
        options: { type: object }
        filters: { $ref: '#/components/schemas/SearchFilters' }
    SearchRequest:
      type: object
      required: [config]
      properties:
        modeId: { type: string }
        config: { type: object }
        articles: { type: array, items: { type: object } }
        options: { type: object }
        filters: { $ref: '#/components/schemas/SearchFilters' }
  responses:
    ValidationError:
      description: Request validation failed
    NotFound:
      description: Resource not found
