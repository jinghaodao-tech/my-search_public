name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: API tests
        run: npm test

      - name: Acceptance tests
        run: npm run acceptance:test

      - name: HTTP benchmark smoke
        run: npm run benchmark:http

      - name: Search quality evaluation
        run: npm run evaluate:search

      - name: Benchmark smoke
        run: npm run benchmark

      - name: Encoding check
        run: npm run check:encoding

      - name: OpenAPI contract check
        run: npm run check:openapi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Write test summary
        run: npm run test:summary

      - name: Upload benchmark and quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-app-verification
          path: artifacts/
          if-no-files-found: ignore

      - name: Docker build
        run: docker build -t my-search-public:test .
